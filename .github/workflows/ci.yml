name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r run build
      - name: Test
        run: pnpm -r run test --run
