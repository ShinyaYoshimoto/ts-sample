name: CI
on:
  push:
  pull_request:
  # Actions タブの「Run workflow」から手動実行できる
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          テスト対象のパッケージ（packages/ からのパス）。
          スペースまたはカンマ区切りで複数指定可（例: result-type api-styles shared/elasticsearch-client）。
          空欄なら全パッケージ。
        required: false
        default: ''
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # elasticsearch-app の統合テスト用（docker-compose.yaml と同じ設定）
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ELASTICSEARCH_NODE: http://localhost:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Resolve target packages
        env:
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: |
          # 入力はシェルに直接埋め込まず、環境変数経由で検証してから使う
          set -f  # 入力中の * などをファイル名に展開しない
          names=$(echo "${INPUT_PACKAGES}" | tr ',' ' ' | xargs)
          if [ -z "$names" ]; then
            echo "対象: 全パッケージ"
            echo "BUILD_FILTER=-r" >> "$GITHUB_ENV"
            echo "TEST_FILTER=-r" >> "$GITHUB_ENV"
            exit 0
          fi
          # ワークスペースに登録されているパッケージ（packages/ からのパス）
          available=$(pnpm ls -r --depth -1 --parseable | sed "s|^$PWD/packages/||" | grep -v "^$PWD$" | sort)
          build_filter=""
          test_filter=""
          for name in $names; do
            if ! grep -qxF -- "$name" <<< "$available"; then
              echo "::error::パッケージが見つかりません: $name（packages/ からのパスを指定してください）"
              echo "指定できるパッケージ:"; echo "$available"
              exit 1
            fi
            # ビルドは依存しているワークスペースパッケージも含める（末尾の ...）
            build_filter+=" --filter {./packages/$name}..."
            test_filter+=" --filter ./packages/$name"
          done
          echo "対象: $names"
          echo "BUILD_FILTER=${build_filter# }" >> "$GITHUB_ENV"
          echo "TEST_FILTER=${test_filter# }" >> "$GITHUB_ENV"
      # pubsub の結合テスト用。Push 型の配信先（テスト中に localhost で起動するサーバー）に届くよう、
      # サービスコンテナではなくホストネットワークで起動する
      - name: Start Pub/Sub emulator
        run: >-
          docker run -d --name pubsub-emulator --network host
          gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
          gcloud beta emulators pubsub start --project=demo-project --host-port=0.0.0.0:8085
      - name: Build
        run: pnpm $BUILD_FILTER run build
      - name: Wait for Elasticsearch
        run: curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s"
      - name: Wait for Pub/Sub emulator
        run: curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8085
      - name: Test
        env:
          PUBSUB_EMULATOR_HOST: localhost:8085
          # エミュレーター利用時は GCE のメタデータサーバーを探しに行かない
          METADATA_SERVER_DETECTION: none
        run: pnpm $TEST_FILTER run test --run

  # packages/pubsub/terraform の静的チェックと terraform test（GCP には接続しない）
  terraform:
    if: ${{ !inputs.packages || contains(inputs.packages, 'pubsub') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pubsub/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Init
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      - name: Test
        run: terraform test
