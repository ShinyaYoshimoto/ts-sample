name: CI
on:
  push:
  pull_request:
  # Actions タブの「Run workflow」から手動実行できる
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          テスト対象のパッケージ（packages/ 配下のディレクトリ名）。
          スペースまたはカンマ区切りで複数指定可（例: sample-trpc sample-elasticsearch-app）。
          空欄なら全パッケージ。
        required: false
        default: ''
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # sample-elasticsearch-app の統合テスト用（docker-compose.yaml と同じ設定）
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ELASTICSEARCH_NODE: http://localhost:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Resolve target packages
        env:
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: |
          # 入力はシェルに直接埋め込まず、環境変数経由で検証してから使う
          names=$(echo "${INPUT_PACKAGES}" | tr ',' ' ' | xargs)
          if [ -z "$names" ]; then
            echo "対象: 全パッケージ"
            echo "BUILD_FILTER=-r" >> "$GITHUB_ENV"
            echo "TEST_FILTER=-r" >> "$GITHUB_ENV"
            exit 0
          fi
          build_filter=""
          test_filter=""
          for name in $names; do
            if ! [[ "$name" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || [ ! -f "packages/$name/package.json" ]; then
              echo "::error::パッケージが見つかりません: $name（packages/ 配下のディレクトリ名を指定してください）"
              echo "指定できるパッケージ:"; ls packages
              exit 1
            fi
            # ビルドは依存しているワークスペースパッケージも含める（末尾の ...）
            build_filter+=" --filter {./packages/$name}..."
            test_filter+=" --filter ./packages/$name"
          done
          echo "対象: $names"
          echo "BUILD_FILTER=${build_filter# }" >> "$GITHUB_ENV"
          echo "TEST_FILTER=${test_filter# }" >> "$GITHUB_ENV"
      - name: Build
        run: pnpm $BUILD_FILTER run build
      - name: Wait for Elasticsearch
        run: curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s"
      - name: Test
        run: pnpm $TEST_FILTER run test --run
